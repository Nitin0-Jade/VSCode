{% extends "layout.html" %}

{% block title %}
Quote
{% endblock %}

{% block main %}

<form action="/quote" method="post">
    <div class="mb-3">
        <input
            autocomplete="off"
            autofocus
            class="form-control mx-auto w-auto" 
            name="symbol"
            placeholder="Stock symbol"
            type="text">
    </div>

    <button class="btn btn-primary" type="submit">Get Quote</button>
</form>

{% if quote %}
    <div class="mt-4">
        <h3>{{ quote["name"] }}</h3>
        <p>
            Symbol: {{ quote["symbol"] }}
        </p>
        <p>
            Price: {{ quote["price"] | usd }}
        </p>
    </div>
{% endif %}

{% endblock %}
