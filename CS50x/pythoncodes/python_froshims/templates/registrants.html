{% extends "layout.html" %}

{% block body %}

    <h1>Registrants</h1>
    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Sport</th>
            </tr>
        </thead>
        <tbody>
            {% for registrant in registrants %}
                <tr>
                    <td>{{ registrants["name"] }}</td>
                    <td>{{ registrants["sport"] }}</td>
                    <td>
                        <form action="/deregister" method="post">
                            <input name="id" type="hidden" value='{{ registrants["id"]}}'>
                            <button type="submit">Deregister</button>
                        </form>
                    </td>
                </tr>
        </tbody>
    </table>

{% endblock %}
