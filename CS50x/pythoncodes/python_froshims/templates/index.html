{% extends "layout.html" %}

{% block body %}

    <h1>Register</h1>
    <form action="/register" method="post">
        <input autocomplete name="name" placeholder="Name" type="text">
        <select name="sport">
            <option Selectes value="">Sport</option>
            {% for sport in sports %}
                <option name="sport" type="checkbox" value="{{ sport}}">{{ sport }}</option> 
            {% endfor %}
        </select>
        <button type="submit">Register</button>
    </form>

{% endblock %}
